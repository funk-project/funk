name: ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check std with the fresh binary
        run: |
          go build -o /tmp/funk ./cmd/funk
          fail=0
          while IFS= read -r f; do
            out=$(FUNK_STD=$PWD/std /tmp/funk check -f "$f" 2>&1) || { echo "FAIL $f"; echo "$out"; fail=1; }
          done < <(find std -name '*.funk')
          exit $fail
